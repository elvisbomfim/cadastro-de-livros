services:

    app:
        build: .
        container_name: ${APP_NAME}-app
        volumes:
            - .:/var/www
            - ./.docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - ${APP_NAME}-network
        depends_on:
            - db
            - redis

    nginx:
        build: .docker/nginx
        container_name: ${APP_NAME}-nginx
        restart: always
        tty: true
        ports:
            - "${NGINX_PORT}:80"
        volumes:
            - .:/var/www
        networks:
            - ${APP_NAME}-network
        depends_on:
            - app

    db:
        build: ./.docker/mysql
        container_name: ${APP_NAME}-db
        restart: always
        tty: true
        ports:
            - "${DATABASE_PORT}:3306"
        volumes:
            - ./.docker/dbdata:/var/lib/mysql
            - ./.docker/mysql:/docker-entrypoint-initdb.d
        environment:
            - MYSQL_DATABASE=${DATABASE_NAME}
            - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD:root}
        networks:
            - ${APP_NAME}-network

    redis:
        image: redis:alpine
        container_name: ${APP_NAME}-redis
        networks:
            - ${APP_NAME}-network

networks:
    ${APP_NAME}-network:
        driver: bridge