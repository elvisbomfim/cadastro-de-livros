services:

    app:
        build: .
        container_name: ${CONTAINER_NAME:-cadastro-de-livros}-app
        volumes:
            - .:/var/www
            - ./.docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - app-network
        depends_on:
            - db
            - redis

    nginx:
        build: .docker/nginx
        container_name: ${CONTAINER_NAME:-cadastro-de-livros}-nginx
        restart: always
        tty: true
        ports:
            - "${NGINX_PORT:-8080}:80"
        volumes:
            - .:/var/www
        networks:
            - app-network
        depends_on:
            - app

    db:
        build: ./.docker/mysql
        container_name: ${CONTAINER_NAME:-cadastro-de-livros}-db
        restart: always
        tty: true
        ports:
            - "${DATABASE_HOST_PORT:-3306}:3306"
        volumes:
            - ./.docker/dbdata:/var/lib/mysql
            - ./.docker/mysql:/docker-entrypoint-initdb.d
        environment:
            - MYSQL_DATABASE=${DB_DATABASE:-cadastro_livros}
            - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD:-root}
        networks:
            - app-network

    redis:
        image: redis:alpine
        container_name: ${CONTAINER_NAME:-cadastro-de-livros}-redis
        networks:
            - app-network

networks:
    app-network:
        name: ${CONTAINER_NAME:-cadastro-de-livros}-network
        driver: bridge